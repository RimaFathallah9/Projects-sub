name: resnet18_input_protocol
base: ../resnet18_finetune.yaml
seeds: [42]
variants:             # how should 48x48 grayscale faces be fed to an ImageNet model?
  s48_stock_stem: {data.image_size: 48, model.small_input: false}
  s48_stride1_stem: {data.image_size: 48, model.small_input: true}
  s96_stock_stem: {data.image_size: 96, model.small_input: false}
  s112_stock_stem: {data.image_size: 112, model.small_input: false}
  s48_gray1ch_stride1: {data.image_size: 48, data.channels: 1, model.small_input: true}
