[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fer"
version = "0.1.0"
description = "Facial Expression Recognition on FER-2013: custom CNN vs ResNet18 vs MobileNetV2"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas", "opencv-python", "pillow", "matplotlib", "seaborn",
    "scikit-learn", "scipy", "tensorboard", "pyyaml", "tqdm",
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "ruff", "fvcore"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
